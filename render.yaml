# One-click deploy on Render: New + > Blueprint > select this repo.
services:
  - type: web
    name: jobmatch-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: in
      - key: ENABLE_LINKEDIN_SCRAPER
        value: "false"
